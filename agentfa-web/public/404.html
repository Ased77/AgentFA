<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1124" />
    <title>صفحه پیدا نشد | ایجنت‌فا</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Standalone page: the app bundle is deliberately not loaded, so this is
         self-contained. It is written in both languages because there is no
         language context here to pick one from. */
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1124;
        color: #e2e8f0;
        font: 400 16px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      main {
        max-width: 30rem;
      }
      .code {
        margin: 0;
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #a78bfa, #f0abfc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0.75rem 0 0;
        color: #94a3b8;
      }
      a {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #7c3aed, #c026d3);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 2px solid #e9d5ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">۴۰۴</p>
      <h1>این صفحه پیدا نشد</h1>
      <p>This page does not exist.</p>
      <a href="/">بازگشت به فروشگاه · Back to the store</a>
    </main>
  </body>
</html>
