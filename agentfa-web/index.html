<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <!-- site:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <!--
      Vazirmatn is self-hosted from the bundle (src/main.tsx imports
      @fontsource/vazirmatn), so there is no render-blocking request to a font
      CDN here and no third-party origin is contacted on first paint.
    -->
    <title>ایجنت‌فا | ایجنت‌های هوش مصنوعی فارسی</title>
    <!--
      Language is applied before first paint by an external script rather than an
      inline one: the deployment sets a Content-Security-Policy, and keeping this
      inline would mean shipping `script-src 'unsafe-inline'` for the whole app
      just to boot one file.
    -->
    <script src="/boot.js"></script>
    <!-- site:head-end -->
  </head>
  <body>
    <!-- site:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- site:body-end -->
  </body>
</html>
