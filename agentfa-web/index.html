<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <!-- site:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1124" />
    <!--
      Vazirmatn is self-hosted from the bundle (src/main.tsx imports
      @fontsource/vazirmatn), so there is no render-blocking request to a font
      CDN here and no third-party origin is contacted on first paint.
    -->
    <title>ایجنت‌فا | ایجنت‌های هوش مصنوعی فارسی</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("agentfa-lang");
          var lang = saved === "fa" || saved === "en" ? saved : "fa";
          var root = document.documentElement;
          root.setAttribute("lang", lang);
          root.setAttribute("dir", lang === "fa" ? "rtl" : "ltr");
          if (lang === "en") {
            root.title = "AgentFa | Persian AI agents";
          }
        } catch (e) {}
      })();
    </script>
    <!-- site:head-end -->
  </head>
  <body>
    <!-- site:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- site:body-end -->
  </body>
</html>
