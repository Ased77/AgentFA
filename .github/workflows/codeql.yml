# CodeQL static analysis (GitHub-native, free for public repositories).
#
# This is an additional, independent gate next to the CI typecheck: CodeQL finds
# injection and taint-flow bugs in the routes and payment/SMS adapters that a
# typechecker cannot see. Its runtime is long (minutes), which is why it lives in
# its own workflow rather than in the main pipeline.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new query release re-examines unchanged code.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write # required to upload results

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # JavaScript analysis covers TypeScript as well.
          languages: javascript-typescript
          # Security-focused queries; add security-and-quality for style
          # findings too (which are noisier and can be triaged separately).
          queries: security-extended

      # `autobuild` does nothing useful for a TS monorepo, so skip the build:
      # CodeQL analyses the source directly.
      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
